:root[data-theme=dark]{--bg:#08121f;--c:#0f1d30;--t:#e8eef6;--m:#9fb0c4;--b:#22344d;--a:#2dd4bf;--ab:#04201d;--n:#050b14;--bad:#f87171;--ok:#2dd4bf}
*{box-sizing:border-box}html,body{margin:0}body{font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--t)}
#app{display:flex;min-height:100vh}nav{width:230px;background:var(--n);color:#fff;padding:16px;flex:none}nav h1{font-size:19px;margin:0 0 4px;display:flex;gap:8px;align-items:center}nav small{color:#9fb0c4;display:block;margin-bottom:14px}

main{flex:1;padding:24px;max-width:1100px;min-width:0}h2{margin:0 0 4px}h3{margin:0 0 8px}.m{color:var(--m)}
.g{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}.card{background:var(--c);border:1px solid var(--b);border-radius:14px;padding:16px;box-shadow:0 1px 3px #0001}
button.p,button.s{font:inherit;border-radius:9px;padding:9px 14px;cursor:pointer;border:1px solid var(--a)}button.p{background:var(--a);color:var(--ab);font-weight:600}button.s{background:none;color:var(--a)}
button:focus-visible,input:focus-visible,select:focus-visible,label:focus-within{outline:3px solid #f59e0b;outline-offset:2px}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;border:1px solid var(--b);color:var(--m);margin:0 4px 4px 0}.big{font-size:28px;font-weight:700}
.bar{height:10px;background:var(--b);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--a)}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.o{display:flex;gap:10px;align-items:flex-start;padding:11px;border:1px solid var(--b);border-radius:10px;margin:7px 0;cursor:pointer;background:var(--c)}.o.ok{border-color:var(--ok);border-width:2px}.o.bad{border-color:var(--bad);border-width:2px}

table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:8px;border-bottom:1px solid var(--b)}th button{all:unset;cursor:pointer;font-weight:700}.sc{overflow-x:auto}
input,select{font:inherit;padding:7px;border:1px solid var(--b);border-radius:8px;background:var(--c);color:var(--t)}
.cert{border:6px double var(--a);padding:32px;text-align:center;background:var(--c);border-radius:6px}
@media(max-width:760px){#app{display:block}nav{width:auto;display:flex;flex-wrap:wrap;gap:4px;align-items:center}nav small{display:none}nav h1{width:100%}nav button{width:auto}main{padding:14px}}
.sim{display:grid;grid-template-columns:1fr 300px;gap:12px}.sc2{background:#0e2238;border-radius:14px;padding:8px}.sc2 svg{width:100%;height:auto;display:block;max-height:70vh}.ob{cursor:pointer}.ob:hover,.ob.on,.ob:focus{filter:drop-shadow(0 0 5px #2dd4bf);outline:none}.pulse,.blink{animation:pl 1s infinite}@keyframes pl{50%{opacity:.2}}.itm{display:flex;gap:8px;align-items:center;width:100%;text-align:left;font:inherit;color:var(--t);background:var(--c);border:1px solid var(--b);border-radius:10px;padding:6px 8px;margin:5px 0;cursor:grab}.itm.on{border:2px solid var(--a)}@media(max-width:760px){.sim{grid-template-columns:1fr}}
@media print{nav,.np{display:none!important}}

{q:'Review the scene. Select the remaining unsafe conditions.',mu:1,o:[['Mobile barrier stored against the wall, not in use',1],['Personal dosimeter left in the changing room',1],['Two idle staff standing near the C-arm',1],['Patient draped for the procedure',0],['Operator wearing a protective apron',0]],e:'Shielding and dosimetry only help when used per local procedure; idle staff should keep distance or leave.'}]},
{id:'s3',t:'The Unexpected Radiation Incident',d:'General radiation safety',df:'Advanced',m:8,obj:['Incident recognition','Immediate response','Escalation','Documentation','Response principles'],st:[
{q:'SIMULATION: an area monitor alarms outside a source room. What is the most appropriate concern?',o:[['A possible abnormal exposure or equipment fault needing prompt, controlled assessment',1],['A false alarm: silence it and continue',0],['A cosmetic fault for next week’s maintenance',0]],e:'Unexpected alarms are treated as real until assessed by qualified personnel.'},
{q:'Select appropriate immediate actions.',mu:1,o:[['Limit access and keep people away from the affected area',1],['Secure the activity if it is safe to do so, per procedure',1],['Gather colleagues to look at the source',0],['Re-enter repeatedly without authorisation or protection',0],['Stay available to brief responders',1]],e:'Avoid exposing additional people unnecessarily. This is simulated content, not a universal emergency procedure.'},
{q:'Select the appropriate notification pathway.',mu:1,o:[['Radiation Protection Officer',1],['Medical physicist or designated radiation safety personnel',1],['Department supervisor',1],['Other personnel named in the facility’s approved procedure',1],['Post about it on social media',0],['Wait until end of shift to report',0]],e:'Escalate promptly through the pathway in the facility’s approved procedure.'},
{q:'Select what should be recorded for the report, per local procedure.',mu:1,o:[['Time, location and what was observed',1],['Persons present and possible exposures',1],['Actions taken and who was notified',1],['Identification of the equipment or source involved',1],['Speculation about who is to blame',0]],e:'Factual, timely records support investigation and learning.'},
{q:'Which statement best summarises a sound response?',o:[['Protect people, limit exposure, escalate promptly, document per local procedure',1],['Investigate alone first; report only if confirmed',0],['A brief verbal mention is enough',0]],e:'Escalation and documentation follow the approved local procedure.'}]}];
SC.push({id:'m1',sim:1,t:'Prepare for the Procedure',d:'Radiology preparation area',df:'Beginner',m:6,obj:['PPE selection','Equipment inspection','Procedure briefing'],st:[{e:'Select only items indicated by the briefing and local risk assessment; not every item is mandatory in every situation, and damaged items should not be used.',o:[]},{e:'Visual inspection can reveal obvious defects but does not prove integrity; formal inspection and QC follow local procedures.',o:[]},{e:'PPE requirements are procedure-specific: read the briefing first.',o:[]}]},{id:'m2',sim:1,t:'Explore the Radiology Room',d:'General diagnostic radiology',df:'Intermediate',m:7,obj:['Hazard identification','Corrective action','Avoiding unnecessary intervention'],st:[{e:'Inspect objects in the room to find genuine hazards before sign-off.',o:[]},{e:'Resolve each hazard and restore the controlled-area boundary before proceeding.',o:[]},{e:'Flagging harmless items wastes time and can hide real hazards.',o:[]}]});
SC.push({id:'m3',sim:1,t:'Operating Theatre: Fluoroscopy Safety',d:'Operating theatre and fluoroscopy',df:'Intermediate',m:8,obj:['Equipment and PPE checks','Positioning and shielding','Fluoroscopy practice and sign-off'],st:[{e:'Equipment faults and missing PPE are corrected before beam-on.',o:[]},{e:'Distance and shielding reduce staff exposure; the right arrangement depends on equipment, projection, access and local protocol.',o:[]},{e:'Limit beam-on time, observe scatter, correct, then sign off.',o:[]}]});
SC.push({id:'m4',sim:1,t:'Incident Response: Unexpected Alarm',d:'General radiation safety',df:'Advanced',m:8,obj:['Recognition and protective actions','Escalation','Documentation'],st:[{e:'Treat an unexplained alarm as real: limit access and avoid unnecessary exposure, per the approved procedure.',o:[]},{e:'Notify the people named in the facility procedure promptly, not informally or later.',o:[]},{e:'Record facts, persons, actions and equipment; avoid speculation about blame.',o:[]}]});
SC.forEach(s=>{s.ver='0.1.0';s.rev='Pending review';s.reviewer='[Reviewer placeholder]';s.rdate='Not yet reviewed'});

S=S||{role:'learner',name:'Demo Learner',r:{},pts:0,log:[],miss:{},days:[],cur:null};let V=S.role=='rpo'?'rpo':'dash',F={q:'',sc:'',st:'',k:'n',d:1};

<p class=row><button class=p data-a=start data-v=${id}>Retry</button>${r.pass?`<button class=s data-a=go data-v=cert:${id}>View certificate</button>`:''}<button class=s data-a=go data-v=dash>Dashboard</button></p>`}

if(V=='rpo'){const a=rows(),m={'Hazard recognition':7,'Protective equipment':6,Escalation:5,'ALARA decisions':4,'Pre-exposure checks':3};Object.entries(S.miss).forEach(([k,v])=>m[k]=(m[k]||0)+v);

return`<h2>RPO Dashboard</h2><div class=warn>All learner records are simulated demonstration data.</div><div class=g>${[['Demo learners',dem.length],['Modules completed',dem.filter(x=>x.st=='Passed').length],['Average score',Math.round(ps.reduce((a,x)=>a+x.l,0)/ps.length)+'%'],['Completion rate',Math.round(dem.filter(x=>x.st=='Passed').length/dem.length*100)+'%']].map(x=>`<div class=card><span class=m>${x[0]}</span><div class=big>${x[1]}</div></div>`).join('')}</div>

function R(){const L=[['dash','Dashboard'],['scen','Training Scenarios'],['prog','My Progress'],['lead','Leaderboard'],['cert','Certificates'],['set','Settings']],T=[['rpo','RPO Dashboard'],['scen','Scenario Library'],['lead','Leaderboard'],['set','Settings']];

document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,v=b.dataset.v,c=S.cur;
if(a=='go')V=v;else if(a=='start'){const k=S.cur?.id==v?S.cur:null;S.cur=k||(sci(v).sim?simInit(v):{id:v,i:0,sel:[],fb:0,hint:0,sc:[],ans:[],t0:Date.now()});V='play'}
else if(a=='check'){if(!c.sel.length){c.err=1}else{c.err=0;const st=sci(c.id).st[c.i],s=scoreStage(st,c.sel,c.hint);c.sc[c.i]=s;c.ans[c.i]=[...c.sel];c.fb=1;if(s<100){const o=sci(c.id).obj[c.i];S.miss[o]=(S.miss[o]||0)+1}}}

else if(a=='sort'){F.d=F.k==v?-F.d:1;F.k=v;$('#tb').innerHTML=tbl();return}else if(a=='csv'){csv();return}else if(a=='print'){print();return}

save();R()});
